services:
  db:
    image: postgres:17-alpine
    container_name: steam_reviews_db
    restart: unless-stopped
    environment:
      # Values come from the .env file next to this compose file.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"   # host:container, so scripts on your machine can reach localhost:5432
    volumes:
      # Named volume: data survives `docker compose down` (removed only with `down -v`).
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder run once, the first time the database is created.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
