services:
  db:
    image: postgres:17-alpine
    container_name: steam_reviews_db
    restart: unless-stopped
    environment:
      # Values come from the .env file next to this compose file.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"   # host:container, so scripts on your machine can reach localhost:5432
    volumes:
      # Named volume: data survives `docker compose down` (removed only with `down -v`).
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder run once, the first time the database is created.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: steam_reviews_api
    restart: unless-stopped
    environment:
      # Inside Docker the database's address is the service name "db", not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres accepts connections

volumes:
  pgdata:
