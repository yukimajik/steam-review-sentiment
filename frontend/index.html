<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Pick the theme before the page draws, so it never flashes the wrong one: a choice saved by the
      // theme button, otherwise the system setting. Storage can be blocked (private windows), hence try.
      (function () {
        var saved = null
        try { saved = localStorage.getItem('steamview-theme') } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <title>SteamView</title>  <!-- keep in step with APP_NAME in src/App.tsx -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
